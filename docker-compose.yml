version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dashboard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-dashboard}
      POSTGRES_USER: ${DB_USERNAME:-dashboard_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dashboard_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-dashboard_user} -d ${DB_DATABASE:-dashboard}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
